trigger:
  branches:
    include:
    - dev

parameters:
- name: ENV
  displayName: Select environment to deploy to
  type: string
  default: Dev
  values:
  - Dev
  - NonProd
  - Prod
variables:
    - ${{ if eq(parameters.ENV, 'Dev') }}:
        - group: dev
    - ${{ if eq(parameters.ENV, 'NonProd') }}:
        - group: nonprod
    - ${{ if eq(parameters.ENV, 'Prod') }}:
        - group: prod

    - name: myserivceConn
      ${{ if eq(parameters.ENV, 'Dev') }}:
        value: 'Nonprod'
      ${{ if eq(parameters.ENV, 'NonProd') }}:
        value: 'Nonprod'
      ${{ if eq(parameters.ENV, 'Prod') }}:
        value: 'Prod'
pool:
  name: 'ADO-Agentpool'

stages:
- template: azure-pipeline-web-app-deploy_template.yaml
  parameters:
    ENV: '${{ parameters.ENV }}'
    imageName: 'react-app'                              # Name of the image
    imageTag: '$(Build.BuildId)'                        # Tag for the image
    registryName: $(registryName)                       #   # Name of the ACR
    serviceConnection: ${{ variables.myserivceConn }}   # Service connection for Azure
    appServiceName: $(clientappServiceName)             # 
    appServiceResourceGroup: $(resourceGroupName)       # '
